<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCASS source provenance</title><style>body{font:15px/1.65 system-ui;background:#f5f7f2;color:#173d32;max-width:1000px;margin:50px auto;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d8e1d5;padding:24px;border-radius:8px}a{color:#397a5a}</style><a href="./#holdings">Back to workbench</a><h1>Raw snapshot provenance</h1><p>Archive paths below identify the original local source. The public demo includes metadata and a selected dataset only.</p><pre id="provenance">Loading…</pre><script type="module">import{openData}from'./data-service.js';try{const q=new URLSearchParams(location.search),s=await(await openData()).snapshot(q.get('stock'),q.get('date'));document.querySelector('#provenance').textContent=JSON.stringify({stock:s.stock,date:s.date,name:s.name,issued:s.issued,detailTotal:s.detailTotal,detailCount:s.participants.length,complete:s.complete,summaryOnly:s.summaryOnly,warnings:s.warnings,summary:s.summary,sources:s.sources,detailSources:s.detailSources},null,2);}catch(e){document.querySelector('#provenance').textContent=e.message;}</script></html>
